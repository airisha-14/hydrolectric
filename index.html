<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hydrolectric Cisadane River | Syafana Islamic School G9E</title>
<style>
:root{--bg:#eef6ff;--card:#ffffff;--ink:#0a2540;--muted:#456384;--dark:#0b3d91;--mid:#1e6fd9;--pale:#d6e9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061a33;--card:#0b2a52;--ink:#e8f2ff;--muted:#9fbde0;--dark:#8cc2ff;--mid:#5aa9f5;--pale:#123a6b}}
:root[data-theme="dark"]{--bg:#061a33;--card:#0b2a52;--ink:#e8f2ff;--muted:#9fbde0;--dark:#8cc2ff;--mid:#5aa9f5;--pale:#123a6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.65}
.wrap{max-width:900px;margin:0 auto;padding:0 22px}
header{background:#0b3d91;color:#fff;text-align:center;padding:50px 0 60px}
.logo-container{display:flex;justify-content:center;gap:16px;margin-bottom:20px}
.school-logo{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:50%;padding:10px;box-shadow:0 6px 16px rgba(0,0,0,0.25)}
header small{display:inline-block;background:rgba(255,255,255,.15);padding:6px 16px;border-radius:99px;font-size:15px;margin-bottom:18px}
h1{font-size:clamp(30px,6vw,48px);margin:0 0 14px;line-height:1.15}
header p{max-width:52ch;margin:0 auto;color:#d6e9ff;font-size:19px}
section{padding:48px 0}
h2{color:var(--dark);font-size:clamp(24px,4vw,32px);margin:0 0 14px}
p{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;padding:22px;border-top:4px solid var(--mid)}
.card h3{margin:0 0 6px;font-size:18px;color:var(--dark)}
.card p{margin:0;color:var(--muted);font-size:16px}
ul{padding-left:22px;margin:0}
li{margin-bottom:8px}
.alt{background:var(--pale)}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media(max-width:720px){.gallery-grid{grid-template-columns:1fr}}
.model-card{background:var(--card);border-radius:16px;padding:14px;text-align:center;border:1px solid rgba(30,111,217,0.2);box-shadow:0 8px 20px rgba(0,0,0,0.06)}
.model-img{max-width:100%;width:100%;height:320px;object-fit:cover;border-radius:10px;display:block}
.poster-card{background:var(--card);border-radius:16px;padding:16px;text-align:center;border:1px solid rgba(30,111,217,0.2);box-shadow:0 8px 20px rgba(0,0,0,0.06);margin-top:20px}
.poster-img{max-width:100%;width:100%;height:auto;max-height:500px;object-fit:contain;border-radius:10px;display:block;margin:0 auto}
.model-card p, .poster-card p{margin:10px 0 0;font-size:15px;color:var(--muted);font-weight:600}
.team{background:#0b3d91;color:#fff;text-align:center;padding:48px 0}
.team h2{color:#fff}
.team p{margin:4px 0;color:#d6e9ff}
.team strong{font-size:22px;color:#fff}
footer{background:#06234f;color:#9fbde0;text-align:center;font-size:14px;padding:16px}
